<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yönetim Paneli Girişi — Beyaz Kuaför</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="lg-body">
  <main class="lg-wrap">
    <section class="lg-card">
      <div class="lg-brand">
        <span class="lg-brand__mark" id="lgMark">B</span>
        <div class="lg-brand__text">
          <strong id="lgSiteName">Beyaz Kuaför</strong>
          <em>Yönetim Paneli</em>
        </div>
      </div>

      <h1 class="lg-title">Yönetim Paneli</h1>
      <p class="lg-sub">Devam etmek için kullanıcı adı ve şifrenizi girin.</p>

      <form id="lgForm" class="lg-form" novalidate>
        <div class="lg-field">
          <label for="lgSite">Site</label>
          <div class="lg-selectwrap">
            <select id="lgSite" name="site"></select>
          </div>
        </div>

        <div class="lg-field">
          <label for="lgUser">Kullanıcı Adı</label>
          <input type="text" id="lgUser" name="username" autocomplete="username" placeholder="admin" spellcheck="false" />
        </div>

        <div class="lg-field">
          <label for="lgPass">Şifre</label>
          <div class="lg-passwrap">
            <input type="password" id="lgPass" name="password" autocomplete="current-password" placeholder="••••••••" />
            <button type="button" class="lg-eye" id="lgToggle" aria-label="Şifreyi göster">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <p class="lg-error" id="lgError" role="alert"></p>

        <button type="submit" class="lg-submit" id="lgSubmit">
          <span class="lg-submit__text">Giriş Yap</span>
          <span class="lg-spinner" aria-hidden="true"></span>
        </button>

        <p class="lg-foot">
          <a href="index.html" id="lgBack">← Siteye Dön</a>
        </p>
      </form>
    </section>

    <p class="lg-note">Veriler sunucuda saklanır — tüm cihazlarınızdan aynı bilgilerle erişebilirsiniz.</p>
  </main>

  <script src="store.js"></script>
  <script src="login.js"></script>
</body>
</html>
