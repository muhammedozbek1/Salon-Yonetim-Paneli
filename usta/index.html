<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usta Paneli</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin.css" />
  <style>
    :root { --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family: Inter, system-ui, sans-serif; display:flex; align-items:center; justify-content:center; }
    .usta-skel { background:var(--surface); border-radius:16px; padding:32px; box-shadow:0 8px 30px rgba(0,0,0,.08); text-align:center; max-width:420px; }
    .usta-skel h1 { font-family:'Playfair Display',serif; margin:0 0 8px; }
    .usta-skel p { color:#4a5160; }
    .usta-skel button { margin-top:16px; padding:10px 18px; border:none; border-radius:10px; background:#0F172A; color:#fff; cursor:pointer; }
  </style>
</head>
<body>
  <div class="usta-skel">
    <h1>Usta Paneli</h1>
    <p>Bu panel yakında doldurulacak.</p>
    <button type="button" id="ustaLogout">Çıkış Yap</button>
  </div>
  <script src="/store.js"></script>
  <script>
    (async () => {
      const S = window.BerberStore;
      const ok = await S.requireAuth();
      if (!ok) return;
      const role = (S.user && S.user.role) || '';
      const isAdmin = role === 'owner' || role === 'admin';
      if (isAdmin) { location.replace('/admin/'); return; }
      const btn = document.getElementById('ustaLogout');
      if (btn) btn.addEventListener('click', async () => {
        await S.logout();
        location.href = S.loginUrl();
      });
    })();
  </script>
</body>
</html>
